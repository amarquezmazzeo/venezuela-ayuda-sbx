schemaVersion: "1"
kind: mixin
name: venezuela-ayuda-secure
displayName: Venezuela Ayuda – Supply-Chain Hardened Dev Environment
description: |
  Mixin kit for mawmawmaw/venezuela-ayuda targeting `sbx run claude`.
  Hardens npm dependency installation against supply-chain attacks:
  - Pins npm to the exact lockfile (ci mode, no resolution drift)
  - Enforces an allowlist of outbound domains (registry, Supabase, OpenAI, FR-API)
  - Proxies all secret credentials — keys never enter the VM
  - Drops an .npmrc that disables pre/post-install scripts by default
  - Installs Socket.dev CLI for post-install CVE + behavioral scan

# ─── Credential sources ───────────────────────────────────────────────────────
# IDs are prefixed with "va-" to avoid collisions with the claude agent's
# built-in kit, which already owns "anthropic" and "openai".
credentials:
  sources:
    va-supabase-secret:
      env:
        - SUPABASE_SECRET_KEY
        - SUPABASE_SERVICE_ROLE_KEY   # legacy fallback
      priority: env-first

    va-openai:
      env:
        - OPENAI_API_KEY
      priority: env-first

    va-fr-api:
      env:
        - FR_API_KEY
      priority: env-first

    va-supabase-db:
      env:
        - SUPABASE_DB_URL             # migration scripts / backup only
      priority: env-first

# ─── Network allowlist ────────────────────────────────────────────────────────
network:
  allowedDomains:
    # npm registry
    - "registry.npmjs.org"
    - "registry.npmjs.com"

    # npm audit + Socket.dev supply-chain scanner
    - "audit.npmjs.org"
    - "socket.dev"
    - "api.socket.dev"

    # Supabase project API
    - "*.supabase.co"
    - "*.supabase.com"

    # OpenAI (optional classifier)
    - "api.openai.com"

    # FR-API face-recognition service
    - "fr-api.reportavnzla.com"

    # MapTiler / OpenStreetMap (NEXT_PUBLIC_MAP_STYLE_URL at build time)
    - "api.maptiler.com"
    - "tile.openstreetmap.org"

    # GitHub (git+ssh package refs in lockfile; read-only)
    - "github.com"
    - "raw.githubusercontent.com"

  serviceDomains:
    "*.supabase.co": va-supabase-secret
    "*.supabase.com": va-supabase-secret
    "api.openai.com": va-openai
    "fr-api.reportavnzla.com": va-fr-api

  serviceAuth:
    va-supabase-secret:
      headerName: "apikey"
      valueFormat: "%s"
    va-openai:
      headerName: "Authorization"
      valueFormat: "Bearer %s"
    va-fr-api:
      headerName: "X-Api-Key"
      valueFormat: "%s"

# ─── Environment variables ────────────────────────────────────────────────────
environment:
  variables:
    NEXT_PUBLIC_SITE_URL: "https://venezuelaayuda.com"
    OPENAI_MODEL: "gpt-4o-mini"
    FR_API_URL: "https://fr-api.reportavnzla.com:8443"
    NEXT_TELEMETRY_DISABLED: "1"
    IS_SANDBOX: "1"

    # npm supply-chain hardening
    NPM_CONFIG_IGNORE_SCRIPTS: "true"
    NPM_CONFIG_PREFER_FROZEN_LOCKFILE: "true"
    NPM_CONFIG_AUDIT_LEVEL: "moderate"
    NPM_CONFIG_PACKAGE_LOCK: "true"
    NPM_CONFIG_FUND: "false"
    NPM_CONFIG_UPDATE_NOTIFIER: "false"

  # Proxy-managed — value injected in-flight; container never sees the secret
  proxyManaged:
    - SUPABASE_SECRET_KEY
    - SUPABASE_SERVICE_ROLE_KEY
    - OPENAI_API_KEY
    - FR_API_KEY
    - SUPABASE_DB_URL

# ─── Commands ─────────────────────────────────────────────────────────────────
commands:
  install:
    # 1. System prerequisites (gettext-base provides envsubst for .env.local)
    - command: "apt-get update -qq && apt-get install -y --no-install-recommends ca-certificates curl gnupg gettext-base"
      user: "0"
      description: "Install system prerequisites"

    # 2. Node.js 22 LTS from signed NodeSource repo
    - command: |
        NODE_MAJOR=22
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
          | gpg --dearmor -o /usr/share/keyrings/nodesource.gpg
        echo "deb [signed-by=/usr/share/keyrings/nodesource.gpg] https://deb.nodesource.com/node_${NODE_MAJOR}.x nodistro main" \
          > /etc/apt/sources.list.d/nodesource.list
        apt-get update -qq && apt-get install -y nodejs
        node --version && npm --version
      user: "0"
      description: "Install Node.js 22 LTS (NodeSource, signed)"

    # 3. Socket.dev CLI — installed globally, no scripts
    - command: "npm install --global --ignore-scripts socket@latest"
      user: "0"
      description: "Install Socket.dev supply-chain scanner"

    # 4. Frozen lockfile install — no lifecycle hooks
    - command: |
        cd ${WORKDIR:-/home/agent/workspace} && \
        npm ci --ignore-scripts --audit=false
      user: "1000"
      description: "Install npm dependencies (lockfile-frozen, no scripts)"

    # 5. npm audit — fail on moderate+ CVEs
    - command: |
        cd ${WORKDIR:-/home/agent/workspace} && \
        npm audit --audit-level=moderate
      user: "1000"
      description: "Audit npm dependency tree for known vulnerabilities"

    # 6. Socket supply-chain scan — non-blocking but printed
    - command: |
        cd ${WORKDIR:-/home/agent/workspace} && \
        socket scan create --strict . || true
      user: "1000"
      description: "Socket.dev behavioral scan (typosquat, malware, install-scripts)"

  startup:
    # Write .env.local on first start (onlyIfMissing semantics via shell guard).
    # Uses envsubst because initFiles doesn't support arbitrary ${VAR} expansion.
    - command:
        - "sh"
        - "-c"
        - |
          ENV_FILE="${WORKDIR:-/home/agent/workspace}/.env.local"
          if [ ! -f "$ENV_FILE" ]; then
            envsubst > "$ENV_FILE" << 'ENVEOF'
          # Generated by venezuela-ayuda-secure sbx kit — DO NOT COMMIT
          # Public vars (safe for browser)
          NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
          NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
          NEXT_PUBLIC_MAP_STYLE_URL=${NEXT_PUBLIC_MAP_STYLE_URL}

          # Server-only vars (proxy-managed; substituted at request time)
          SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          OPENAI_MODEL=${OPENAI_MODEL}
          FR_API_URL=${FR_API_URL}
          FR_API_KEY=${FR_API_KEY}
          SUPABASE_DB_URL=${SUPABASE_DB_URL}

          # Flags
          NEXT_TELEMETRY_DISABLED=${NEXT_TELEMETRY_DISABLED}
          IS_SANDBOX=${IS_SANDBOX}
          ENVEOF
            chmod 600 "$ENV_FILE"
            echo "[kit] wrote .env.local"
          else
            echo "[kit] .env.local already exists, skipping"
          fi
      user: "1000"
      background: false
      description: "Write .env.local from proxy-managed env vars (envsubst)"

    # Re-run audit on every start to catch newly published advisories
    - command:
        - "sh"
        - "-c"
        - |
          cd ${WORKDIR:-/home/agent/workspace} && \
          npm audit --audit-level=moderate 2>&1 | tee /tmp/npm-audit.log \
            || echo "[WARN] npm audit found issues — see /tmp/npm-audit.log"
      user: "1000"
      background: true
      description: "Re-run npm audit on startup (advisory refresh)"

# ─── CLAUDE.md memory instructions ───────────────────────────────────────────
memory: |
  ## Supply-Chain Security Constraints (venezuela-ayuda-secure kit)

  This sandbox enforces supply-chain hardening for the venezuela-ayuda project.
  Follow these rules when working with npm dependencies:

  ### Adding or updating packages
  - ALWAYS use `npm install --ignore-scripts <pkg>` — never without the flag.
    Lifecycle hooks (preinstall, postinstall, install) are the primary attack
    vector for malicious packages.
  - After adding a dependency, run `npm audit` and `socket scan create .` before
    committing. Both must pass clean.
  - Pin major versions in package.json (e.g. `"next": "16.x"`). Avoid `*` or
    `latest` as version specifiers.
  - NEVER commit package-lock.json changes without reviewing the diff for
    unexpected transitive additions.

  ### Environment / secrets
  - `.env.local` is generated by the kit on first start. Do NOT manually add
    secrets there — they are proxy-managed and injected at request time.
  - SUPABASE_SECRET_KEY, OPENAI_API_KEY, FR_API_KEY, and SUPABASE_DB_URL are
    never stored in the VM. Reference them via environment variables only.
  - NEXT_PUBLIC_* vars are safe for the browser but must not contain secrets.

  ### Network
  - Only the domains in the kit's allowedDomains may be reached. Any new
    external service must be added to the kit spec and reviewed.
  - FR-API (fr-api.reportavnzla.com:8443) is server-side only; key is injected
    by the proxy.

  ### Running the app
  ```
  npm run dev     # dev server at http://localhost:3000
  npm run build   # production build (validates types + routes)
  npm run lint    # ESLint
  npm test        # node --test scripts/*.test.mjs
  ```
