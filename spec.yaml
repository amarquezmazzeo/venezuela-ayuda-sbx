schemaVersion: "1"
kind: mixin
name: venezuela-ayuda-shell
displayName: Venezuela Ayuda – Supply-Chain Hardened Shell Environment
description: |
  Mixin kit for mawmawmaw/venezuela-ayuda targeting `sbx run shell`.
  The shell agent is a bare Bash login shell with no pre-installed agent
  binary or Node.js — this kit bootstraps the full toolchain and hardens
  npm dependency installation against supply-chain attacks.

  Key differences from the claude-agent variant:
  - No `memory:` block (shell has no aiFilename / CLAUDE.md)
  - No background startup audit (you're in the shell; output prints inline)
  - Bash profile drops a MOTD reminding you of security constraints
  - `npm run dev` is not auto-started — you run it yourself interactively

# ─── Credential sources ───────────────────────────────────────────────────────
credentials:
  sources:
    supabase-secret:
      env:
        - SUPABASE_SECRET_KEY
        - SUPABASE_SERVICE_ROLE_KEY
      priority: env-first

    openai:
      env:
        - OPENAI_API_KEY
      priority: env-first

    fr-api:
      env:
        - FR_API_KEY
      priority: env-first

    supabase-db:
      env:
        - SUPABASE_DB_URL
      priority: env-first

# ─── Network allowlist ────────────────────────────────────────────────────────
network:
  allowedDomains:
    # npm registry
    - "registry.npmjs.org"
    - "registry.npmjs.com"

    # npm audit + Socket.dev supply-chain scanner
    - "audit.npmjs.org"
    - "socket.dev"
    - "api.socket.dev"

    # NodeSource GPG key + repo (used during install command)
    - "deb.nodesource.com"
    - "keyserver.ubuntu.com"

    # Supabase project API
    - "*.supabase.co"
    - "*.supabase.com"

    # OpenAI (optional classifier)
    - "api.openai.com"

    # FR-API face-recognition
    - "fr-api.reportavnzla.com"

    # MapTiler tiles
    - "api.maptiler.com"
    - "tile.openstreetmap.org"

    # GitHub (git+ssh package refs in lockfile; read-only)
    - "github.com"
    - "raw.githubusercontent.com"

  serviceDomains:
    "*.supabase.co": supabase-secret
    "*.supabase.com": supabase-secret
    "api.openai.com": openai
    "fr-api.reportavnzla.com": fr-api

  serviceAuth:
    supabase-secret:
      headerName: "apikey"
      valueFormat: "%s"
    openai:
      headerName: "Authorization"
      valueFormat: "Bearer %s"
    fr-api:
      headerName: "X-Api-Key"
      valueFormat: "%s"

# ─── Environment variables ────────────────────────────────────────────────────
environment:
  variables:
    # Public / non-secret vars set directly
    NEXT_PUBLIC_SITE_URL: "https://venezuelaayuda.com"
    OPENAI_MODEL: "gpt-4o-mini"
    FR_API_URL: "https://fr-api.reportavnzla.com:8443"
    NEXT_TELEMETRY_DISABLED: "1"
    IS_SANDBOX: "1"

    # npm supply-chain hardening (env layer; .npmrc is the file layer)
    NPM_CONFIG_IGNORE_SCRIPTS: "true"
    NPM_CONFIG_PREFER_FROZEN_LOCKFILE: "true"
    NPM_CONFIG_AUDIT_LEVEL: "moderate"
    NPM_CONFIG_PACKAGE_LOCK: "true"
    NPM_CONFIG_FUND: "false"
    NPM_CONFIG_UPDATE_NOTIFIER: "false"

  # Proxy-managed — value is injected in-flight; container never sees the secret
  proxyManaged:
    - SUPABASE_SECRET_KEY
    - SUPABASE_SERVICE_ROLE_KEY
    - OPENAI_API_KEY
    - FR_API_KEY
    - SUPABASE_DB_URL

# ─── Commands ─────────────────────────────────────────────────────────────────
commands:
  install:
    # 1. System prerequisites
    - command: "apt-get update -qq && apt-get install -y --no-install-recommends ca-certificates curl gnupg git"
      user: "0"
      description: "Install system prerequisites"

    # 2. Node.js 22 LTS from signed NodeSource repo
    - command: |
        NODE_MAJOR=22
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
          | gpg --dearmor -o /usr/share/keyrings/nodesource.gpg
        echo "deb [signed-by=/usr/share/keyrings/nodesource.gpg] https://deb.nodesource.com/node_${NODE_MAJOR}.x nodistro main" \
          > /etc/apt/sources.list.d/nodesource.list
        apt-get update -qq && apt-get install -y nodejs
        node --version && npm --version
      user: "0"
      description: "Install Node.js 22 LTS (NodeSource, signed)"

    # 3. Socket.dev supply-chain scanner — installed globally, no scripts
    - command: "npm install --global --ignore-scripts socket@latest"
      user: "0"
      description: "Install Socket.dev supply-chain scanner"

    # 4. Frozen lockfile install — no lifecycle hooks
    - command: |
        cd ${WORKDIR:-/home/agent/workspace} && \
        npm ci --ignore-scripts --audit=false
      user: "1000"
      description: "Install project dependencies (lockfile-frozen, no scripts)"

    # 5. npm audit — fail on moderate+ CVEs
    - command: |
        cd ${WORKDIR:-/home/agent/workspace} && \
        npm audit --audit-level=moderate
      user: "1000"
      description: "Audit npm tree — fail on moderate+ CVEs"

    # 6. Socket supply-chain scan — non-blocking but visible
    - command: |
        cd ${WORKDIR:-/home/agent/workspace} && \
        socket scan create --strict . || true
      user: "1000"
      description: "Socket.dev behavioral scan (typosquat, malware, install-scripts)"

  initFiles:
    # .env.local written from proxy-injected values; mode 0600; won't overwrite
    - path: /home/agent/workspace/.env.local
      onlyIfMissing: true
      mode: "0600"
      content: |
        # Generated by venezuela-ayuda-shell sbx kit — DO NOT COMMIT
        # Public vars (safe for browser)
        NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_MAP_STYLE_URL=${NEXT_PUBLIC_MAP_STYLE_URL}

        # Server-only vars (proxy-managed; substituted at request time)
        SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
        OPENAI_API_KEY=${OPENAI_API_KEY}
        OPENAI_MODEL=${OPENAI_MODEL}
        FR_API_URL=${FR_API_URL}
        FR_API_KEY=${FR_API_KEY}
        SUPABASE_DB_URL=${SUPABASE_DB_URL}

        # Flags
        NEXT_TELEMETRY_DISABLED=${NEXT_TELEMETRY_DISABLED}
        IS_SANDBOX=${IS_SANDBOX}

    # Bash profile MOTD — printed when you attach to the shell
    - path: /home/agent/.config/venezuela-ayuda-motd.sh
      mode: "0755"
      content: |
        #!/usr/bin/env bash
        echo ""
        echo "╔══════════════════════════════════════════════════════════╗"
        echo "║  venezuela-ayuda-shell  ·  supply-chain hardened env    ║"
        echo "╠══════════════════════════════════════════════════════════╣"
        echo "║  npm audit log  →  /tmp/npm-audit.log                   ║"
        echo "║  .env.local     →  auto-generated (0600, proxy-managed) ║"
        echo "╠══════════════════════════════════════════════════════════╣"
        echo "║  RULES: always use --ignore-scripts when adding pkgs    ║"
        echo "║         run: npm audit && socket scan create .           ║"
        echo "║         never commit secrets or .env.local               ║"
        echo "╚══════════════════════════════════════════════════════════╝"
        echo ""
        if [ -f /tmp/npm-audit.log ]; then
          VULN_COUNT=$(grep -c '"severity"' /tmp/npm-audit.log 2>/dev/null || echo "0")
          if [ "$VULN_COUNT" -gt 0 ]; then
            echo "  ⚠  npm audit found issues — run: cat /tmp/npm-audit.log"
            echo ""
          fi
        fi

    # Append MOTD call to bash profile so it shows on login
    - path: /home/agent/.bash_profile
      onlyIfMissing: false
      content: |
        # venezuela-ayuda-shell kit
        export PATH="$HOME/.local/bin:$PATH"
        [ -f ~/.bashrc ] && source ~/.bashrc
        bash /home/agent/.config/venezuela-ayuda-motd.sh

  startup:
    # Re-run audit on every sandbox start; foreground-safe since shell hasn't
    # connected yet — output goes to /tmp/npm-audit.log for MOTD to reference.
    - command:
        - "sh"
        - "-c"
        - |
          cd ${WORKDIR:-/home/agent/workspace} && \
          npm audit --audit-level=moderate > /tmp/npm-audit.log 2>&1 || true
      user: "1000"
      background: true
      description: "Refresh npm audit log on startup"
